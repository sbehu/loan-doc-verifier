<svg viewBox="0 0 1180 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#ffffff"/>

  <text x="590" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">loan_doc_verifier -- pipeline overview</text>

  <!-- Row 1: Uploaded documents -->
  <text x="30" y="72" font-size="13" font-weight="700" fill="#555">1. UPLOAD</text>
  <g font-size="12" fill="#1a1a2e">
    <rect x="30" y="80" width="1120" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="590" y="100" text-anchor="middle" font-size="12" fill="#555">Aadhaar &#183; PAN &#183; Application Form &#183; Bank/UPI Statement &#183; Electricity Bill &#183; Selfie &#183; Salary Slip &#183; Signature Reference</text>
    <text x="590" y="120" text-anchor="middle" font-size="11" fill="#777">(image or PDF, incl. password-protected -- converted to PNG via PyMuPDF before reaching any check)</text>
  </g>

  <line x1="590" y1="136" x2="590" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: 8 parallel checks -->
  <text x="30" y="182" font-size="13" font-weight="700" fill="#555">2. DOCUMENT CHECKS (run in parallel, independent of each other)</text>

  <g font-size="11.5" text-anchor="middle">
    <!-- 8 boxes, 4 columns x 2 rows -->
    <g fill="#fff7ed" stroke="#fdba74">
      <rect x="30"  y="196" width="266" height="58" rx="8"/>
      <rect x="306" y="196" width="266" height="58" rx="8"/>
      <rect x="582" y="196" width="266" height="58" rx="8"/>
      <rect x="858" y="196" width="292" height="58" rx="8"/>
      <rect x="30"  y="264" width="266" height="58" rx="8"/>
      <rect x="306" y="264" width="266" height="58" rx="8"/>
      <rect x="582" y="264" width="266" height="58" rx="8"/>
      <rect x="858" y="264" width="292" height="58" rx="8"/>
    </g>
    <g fill="#1a1a2e">
      <text x="163" y="219">Signature</text>
      <text x="163" y="236" font-size="10" fill="#777">vision LLM: handwriting match</text>
      <text x="439" y="219">Balance Reconciliation</text>
      <text x="439" y="236" font-size="10" fill="#777">Textract table extract + exact math</text>
      <text x="715" y="219">Address Consistency</text>
      <text x="715" y="236" font-size="10" fill="#777">vision LLM: match + bill recency</text>
      <text x="1004" y="219">Identity Consistency</text>
      <text x="1004" y="236" font-size="10" fill="#777">name/PAN/Aadhaar cross-doc match</text>

      <text x="163" y="287">Photo Match</text>
      <text x="163" y="304" font-size="10" fill="#777">AWS Rekognition CompareFaces</text>
      <text x="439" y="287">Income (Salary)</text>
      <text x="439" y="304" font-size="10" fill="#777">form vs slip vs bank credit, 3-way</text>
      <text x="715" y="287">Income (UPI)</text>
      <text x="715" y="304" font-size="10" fill="#777">declared vs actual UPI credits</text>
      <text x="1004" y="287">Document Recycling</text>
      <text x="1004" y="304" font-size="10" fill="#777">CLIP embedding search across pool</text>
    </g>
  </g>

  <line x1="590" y1="322" x2="590" y2="348" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: borderline -> agentic investigation -->
  <text x="30" y="368" font-size="13" font-weight="700" fill="#555">3. AGENTIC STEP (only for borderline results, e.g. income gap 10-20%)</text>
  <rect x="240" y="380" width="700" height="70" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="590" y="408" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">Investigation LLM call: reasons over raw transaction rows</text>
  <text x="590" y="428" text-anchor="middle" font-size="11" fill="#555">"is this gap an explainable pattern, or does it look suspicious?" -- the one genuine reasoning step in the pipeline</text>

  <line x1="590" y1="450" x2="590" y2="476" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4: rule engine -->
  <text x="30" y="496" font-size="13" font-weight="700" fill="#555">4. VERDICT ENGINE (plain code, not an LLM call -- kept auditable)</text>
  <rect x="180" y="508" width="820" height="86" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="590" y="534" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="600">Severity-based aggregation across every check's findings</text>
  <text x="590" y="554" text-anchor="middle" font-size="11" fill="#555">worst severity present decides the verdict (one reject-tier issue -&gt; REJECT; else any warning -&gt; WARNING_RESUBMISSION;</text>
  <text x="590" y="572" text-anchor="middle" font-size="11" fill="#555">else any conditional -&gt; CONDITIONAL_APPROVAL) -- every issue is still listed, regardless of tier</text>

  <line x1="590" y1="594" x2="590" y2="620" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 5: verdicts -->
  <text x="30" y="640" font-size="13" font-weight="700" fill="#555">5. VERDICT</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="130" y="652" width="230" height="54" rx="8" fill="#dcfce7" stroke="#4ade80"/>
    <text x="245" y="684" fill="#166534">APPROVE</text>

    <rect x="390" y="652" width="230" height="54" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="505" y="678" fill="#92400e">CONDITIONAL_</text>
    <text x="505" y="694" fill="#92400e">APPROVAL</text>

    <rect x="650" y="652" width="230" height="54" rx="8" fill="#fed7aa" stroke="#fb923c"/>
    <text x="765" y="678" fill="#9a3412">WARNING_</text>
    <text x="765" y="694" fill="#9a3412">RESUBMISSION</text>

    <rect x="910" y="652" width="240" height="54" rx="8" fill="#fecaca" stroke="#f87171"/>
    <text x="1030" y="684" fill="#991b1b">REJECT</text>
  </g>

  <!-- Recycling side note -->
  <path d="M 1004 322 C 1004 550, 1030 610, 1030 650" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1030" y="740" text-anchor="middle" font-size="10.5" fill="#991b1b">document recycling alone</text>
  <text x="1030" y="754" text-anchor="middle" font-size="10.5" fill="#991b1b">always forces REJECT directly</text>

  <!-- Eval note -->
  <rect x="30" y="800" width="1120" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="822" font-size="12" font-weight="700" fill="#334155">Evaluation (14 synthetic ground-truth personas):</text>
  <text x="50" y="842" font-size="11.5" fill="#475569">precision 1.00 &#183; recall 0.80 &#183; F1 0.89 &#183; FPR 0.00 &#183; FNR 0.20 -- ground truth = fraud_type label, prediction = verdict != APPROVE</text>
  <text x="50" y="860" font-size="11" fill="#94a3b8">(small sample -- not statistically significant; two known false negatives are documented in Limitations below)</text>
</svg>
